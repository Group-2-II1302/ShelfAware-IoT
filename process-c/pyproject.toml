[project]
name = "process-c"
version = "0.1.0"
description = "ShelfAware Process C — first-time setup HTTP server (AP-mode provisioning daemon)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ShelfAware" }]

dependencies = [
    "aiohttp>=3.9,<4.0",
    "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
process-c = "process_c.main:run"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["process_c"]

# Include captive-portal HTML templates. importlib.resources finds them
# at runtime via the process_c.templates subpackage (its __init__.py
# makes hatchling track the directory; this stanza ensures the .html
# files travel along with the .py).
[tool.hatch.build.targets.wheel.force-include]
"process_c/templates/provision.html" = "process_c/templates/provision.html"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
files = ["process_c", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
